services:
  pgvector:
    image: pgvector/pgvector:0.8.5-pg16
    environment:
      POSTGRES_DB: repopilot
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: repopilot
    ports:
      - "${REPOPILOT_PGVECTOR_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot -d repopilot"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - repopilot_pgvector_data:/var/lib/postgresql/data

volumes:
  repopilot_pgvector_data:
