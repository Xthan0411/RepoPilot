[project]
name = "repopilot"
version = "0.1.0"
description = "An evaluation-driven coding agent for repository-level issue investigation and repair."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Yizhen Xu" },
]
dependencies = [
    "langchain-core>=1.4,<2",
    "langgraph>=1.2,<2",
    "openai>=2,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6.0,<7",
    "typer>=0.21,<1",
]

[project.optional-dependencies]
jina = [
    "sentence-transformers>=5.6,<6",
    "transformers>=4.57,<5",
]

[project.scripts]
repopilot = "repopilot.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
markers = [
    "integration: tests that require PostgreSQL, pgvector, Docker, or multiple modules",
    "security: tests for policy enforcement and hostile inputs",
    "real_model: tests that call a paid external model API",
    "eval: fixed-task evaluation runs excluded from ordinary CI",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures/repositories/python_chunker"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
